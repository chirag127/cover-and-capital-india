name: Validate Pull Request & Content Integrity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Financial Mathematics Unit Tests
        run: npm test

      - name: Run Editorial & Content Validation
        run: node ./scripts/validate-content.mjs

      - name: Run Link & Base-Path Verification
        run: node ./scripts/check-links.mjs

      - name: Verify Astro Static Build
        run: npm run build
